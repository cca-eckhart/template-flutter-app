name: htlinn_flutter_app
description: "Flutter Projekt - Wirtschaftsingenieure Betriebsinformatik"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/wii-icon.png
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/icons/wii-icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
